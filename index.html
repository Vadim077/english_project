<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 350px); }
        .user-msg { background-color: #2563eb; align-self: flex-end; border-radius: 1rem 1rem 0 1rem; color: white; margin-left: auto; }
        .ai-msg { background-color: #334155; align-self: flex-start; border-radius: 1rem 1rem 1rem 0; color: white; margin-right: auto; }
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="max-w-3xl mx-auto p-4 flex flex-col min-h-screen">
        
        <header class="py-6 text-center border-b border-slate-800">
            <h1 class="text-2xl font-bold text-blue-400">AI Language Trainer</h1>
        </header>

        <!-- SETUP SCREEN -->
        <div id="setup-screen" class="flex-1 flex flex-col justify-center items-center">
            <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 text-center">Настройка тренировки</h2>
                
                <label class="block text-xs uppercase text-slate-500 font-bold mb-2">Уровень английского</label>
                <select id="level" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="A1">A1 - Beginner</option>
                    <option value="A2">A2 - Pre-Intermediate</option>
                    <option value="B1">B1 - Intermediate</option>
                    <option value="B2">B2 - Upper-Intermediate</option>
                    <option value="C1">C1 - Advanced</option>
                </select>

                <label class="block text-xs uppercase text-slate-500 font-bold mb-2">Ситуация (на русском)</label>
                <textarea id="scenario" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-4 h-32 mb-6 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Например: Я хочу заказать пиццу..."></textarea>
                
                <button onclick="startChat()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all shadow-lg active:scale-95">
                    Начать диалог
                </button>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen" class="hidden flex-1 flex flex-col">
            <div id="chat-box" class="chat-container overflow-y-auto flex flex-col gap-4 py-6 px-2"></div>
            
            <div class="mt-auto py-6 border-t border-slate-800">
                <div id="corrections" class="mb-4 p-4 bg-amber-900/20 border-l-4 border-amber-500 rounded-lg text-amber-200 text-sm italic hidden"></div>
                
                <div class="flex gap-2">
                    <input id="user-input" type="text" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-5 py-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ответьте на английском...">
                    <button onclick="handleSend()" class="bg-blue-600 px-8 rounded-xl font-bold hover:bg-blue-500 transition-colors">Send</button>
                </div>
                <button onclick="location.reload()" class="mt-4 text-xs text-slate-500 hover:text-slate-300 mx-auto block uppercase tracking-widest">Вернуться назад</button>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];
        const chatBox = document.getElementById('chat-box');
        const correctionsBox = document.getElementById('corrections');

        async function startChat() {
            const scenario = document.getElementById('scenario').value.trim();
            if (!scenario) return alert('Опишите ситуацию!');

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');

            const loadingId = addMessage('ai', 'Вхожу в роль...', true);

            try {
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: "Let's start. You speak first as the character.",
                        history: [],
                        level: document.getElementById('level').value,
                        scenario: scenario
                    })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                addMessage('ai', data.reply);
                speak(data.reply);
            } catch (err) {
                document.getElementById(loadingId).textContent = "Ошибка связи. Убедитесь, что main.py запущен.";
            }
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            addMessage('user', text);
            const loadingId = addMessage('ai', '...', true);

            try {
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: chatHistory.slice(-10),
                        level: document.getElementById('level').value,
                        scenario: document.getElementById('scenario').value
                    })
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();
                addMessage('ai', data.reply);
                
                if (data.corrections && data.corrections !== "Все верно!") {
                    correctionsBox.textContent = "Разбор ошибок: " + data.corrections;
                    correctionsBox.classList.remove('hidden');
                } else {
                    correctionsBox.classList.add('hidden');
                }
                speak(data.reply);
            } catch (err) {
                document.getElementById(loadingId).textContent = "Ошибка сервера.";
            }
        }

        function addMessage(role, text, isLoading = false) {
            const id = 'm-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = `p-4 max-w-[85%] mb-2 shadow-md ${role === 'user' ? 'user-msg' : 'ai-msg'} ${isLoading ? 'loading' : ''}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            
            if (!isLoading) chatHistory.push({role, content: text});
            return id;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
