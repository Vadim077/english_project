<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Trainer</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="lang-switcher">
        <button onclick="setLanguage('RU')" id="lang-ru" class="lang-btn lang-btn-active">RU</button>
        <button onclick="setLanguage('EN')" id="lang-en" class="lang-btn">EN</button>
    </div>

    <div id="dashboard" class="dashboard-container">
        <div class="dashboard-card">
            <div style="text-align: left; margin-bottom: 2rem;">
                <div style="display: inline-flex; padding: 0.75rem; background: var(--primary); border-radius: 1rem; margin-bottom: 1rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1);">
                    <i data-lucide="sparkles" style="color: white; width: 1.5rem; height: 1.5rem;"></i>
                </div>
                <h1 id="ui-title" style="font-size: 2.25rem; font-weight: 900; text-transform: uppercase;">AI Language Trainer</h1>
                <p id="ui-subtitle" style="color: var(--text-muted); font-size: 0.875rem; font-weight: 500;">Профессиональный тренажер английского языка.</p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 2rem;">
                <div>
                    <span id="ui-level-label" style="display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.75rem; margin-left: 0.25rem;">Выберите уровень</span>
                    <select id="level-select" class="level-select">
                        <option value="A0">A0 Beginner</option>
                        <option value="A1">A1 Elementary</option>
                        <option value="A2">A2 Pre-Intermediate</option>
                        <option value="B1" selected>B1 Intermediate</option>
                        <option value="B2">B2 Upper-Intermediate</option>
                        <option value="C1">C1 Advanced</option>
                        <option value="C2">C2 Mastery</option>
                    </select>
                </div>

                <div>
                    <label id="ui-topic-label" style="display: block; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 0.75rem; margin-left: 0.25rem;">Ситуация (на русском)</label>
                    <textarea id="topic-input" class="input-area" placeholder="Например: Покупка билетов..."></textarea>
                </div>

                <button onclick="startDialogue()" id="start-btn" class="btn-start">
                    <span id="ui-start-btn-text">Начать практику</span>
                    <i data-lucide="arrow-right" style="width: 1rem; height: 1rem;"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="chat-screen" class="chat-container hidden">
        <div class="bg-overlay"></div>

        <aside class="chat-sidebar">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2.5rem;">
                <div style="padding: 0.5rem; background: var(--primary); border-radius: 0.75rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <i data-lucide="search" style="color: white; width: 1rem; height: 1rem;"></i>
                </div>
                <h2 id="ui-analysis-title" style="font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;">Анализ</h2>
            </div>
            
            <div id="analysis-box" class="analysis-box">
                Жду сообщения...
            </div>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; opacity: 0.3;">
                <i data-lucide="shield-check" style="width: 1rem; height: 1rem;"></i>
                <span style="font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;">Secure Connection</span>
            </div>
        </aside>

        <main class="chat-main">
            <header class="chat-header">
                <button onclick="resetToDashboard()" style="padding: 0.625rem; background: white; border: 1px solid var(--border); border-radius: 0.75rem; color: var(--text-muted); cursor: pointer;">
                    <i data-lucide="chevron-left" style="width: 1.25rem; height: 1.25rem;"></i>
                </button>
                <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                    <span id="ui-live-label" style="font-size: 9px; font-weight: 900; letter-spacing: 0.4em; color: var(--text-muted); margin-bottom: 0.25rem; text-transform: uppercase;">Live Practice</span>
                    <div style="display: flex; align-items: center; gap: 0.75rem; background: white; padding: 0.375rem 1rem; border-radius: 9999px; border: 1px solid var(--border);">
                        <span id="status-dot" style="width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--border);"></span>
                        <span id="ui-ai-status" style="font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);">AI Partner Active</span>
                    </div>
                </div>
                <div style="width: 2.5rem;"></div>
            </header>

            <div id="messages-container" class="messages-list"></div>

            <div id="hints-container" class="hidden" style="position: absolute; bottom: 8rem; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; flex-direction: column; gap: 0.75rem; z-index: 100; animation: slideUp 0.3s ease-out;">
            </div>

            <style>
                @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
                .hint-item { cursor: pointer; padding: 1rem; background: white; border: 2px solid var(--border); border-radius: 1rem; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                .hint-item:hover { border-color: var(--accent); background: #f5f3ff; transform: scale(1.02); }
            </style>

            <div id="recording-visual" class="hidden" style="position: absolute; bottom: 8rem; left: 0; right: 0; display: flex; align-items: flex-end; justify-content: center; height: 3rem; gap: 0.375rem; pointer-events: none; z-index: 100;">
                <div class="dot-anim" style="width: 6px; background: var(--red); border-radius: 999px; height: 1rem;"></div>
                <div class="dot-anim" style="width: 6px; background: var(--red); border-radius: 999px; height: 2.5rem; animation-delay: 0.1s;"></div>
                <div class="dot-anim" style="width: 6px; background: var(--red); border-radius: 999px; height: 1.5rem; animation-delay: 0.2s;"></div>
            </div>

            <footer class="chat-footer">
                <div class="footer-inner">
                    <button id="hint-btn" onclick="toggleHints()" class="mic-btn" style="background: white;" title="Подсказка"><i data-lucide="lightbulb" style="width: 1.5rem; height: 1.5rem;"></i></button>
                    <button id="mic-btn" class="mic-btn"><i data-lucide="mic" style="width: 2rem; height: 2.5rem;"></i></button>

                    <div class="input-wrapper">
                        <input id="user-input" type="text" onkeydown="if(event.key==='Enter') sendMessage()" class="chat-input" placeholder="...">
                        <button onclick="sendMessage()" class="send-btn"><i data-lucide="send" style="width: 1.25rem; height: 1.25rem;"></i></button>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
